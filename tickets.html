<script>
(function() {
  const sponsors = ["./assets/images/sponsors/uvbi.png","./assets/images/sponsors/garmscales.png","./assets/images/sponsors/chilicode.png","./assets/images/sponsors/flagnation.png","./assets/images/sponsors/fma.png","./assets/images/sponsors/rebels.png","./assets/images/sponsors/tnt-league.png"];

  function applyFlagNation() {
    // 1. Quitar absolutamente cualquier marca de agua de Framer
    const badge = document.getElementById('__framer-badge-container') || document.querySelector('.__framer-badge');
    if (badge) badge.remove();
    document.querySelectorAll('a[href*="framer.com"]').forEach(el => {
      if ((el.textContent || '').toLowerCase().includes('made in framer')) el.remove();
    });

    // 2. Reemplazar logo del Navbar superior (pulpo/Kraqen)
    document.querySelectorAll('nav img, header img, [data-framer-name="Nav"] img, [data-framer-name="Bar"] img').forEach(img => {
      if (!img.src.includes('flagnation-logo.png')) {
        img.src = './assets/images/flagnation-logo.png';
        if (img.srcset) img.srcset = './assets/images/flagnation-logo.png';
        img.style.objectFit = 'contain';
      }
    });

    // También cualquier logo residual de kraqen
    document.querySelectorAll('img[alt*="kraQen" i], img[alt*="Kraqen" i], img[src*="5AZ352URApW7b48833JZg1I6Q3ef5"]').forEach(img => {
      if (!img.src.includes('flagnation-logo.png')) {
        img.src = './assets/images/flagnation-logo.png';
        if (img.srcset) img.srcset = './assets/images/flagnation-logo.png';
      }
    });

    // 3. Reemplazar el cuadro de "OFFICIAL SPONSORS" (Patrocinadores)
    const patroBox = document.querySelectorAll('[data-framer-name="Patrocinadores"] [data-framer-name="Logo"]');
    patroBox.forEach((el, idx) => {
      if (!el.dataset.customReplaced) {
        el.dataset.customReplaced = "true";
        const logoSrc = sponsors[idx % sponsors.length];
        el.innerHTML = '<img src="' + logoSrc + '" alt="Sponsor" style="height:36px;max-width:120px;object-fit:contain;filter:brightness(1) contrast(1.05);display:block;margin:auto;" />';
      }
    });

    // 4. Reemplazar patrocinadores del carrusel / ticker
    const tickerBrands = ['Apple', 'Nike', "McDonald's", 'Windows', 'Target', 'Adidas', 'Spotify', 'Airbnb', 'Google', 'Pepsi', 'Red Bull'];
    let tIdx = 0;
    tickerBrands.forEach(b => {
      document.querySelectorAll('[data-framer-name="' + b + '"]').forEach(el => {
        if (!el.dataset.tickerReplaced) {
          el.dataset.tickerReplaced = "true";
          const logoSrc = sponsors[tIdx % sponsors.length];
          el.innerHTML = '<img src="' + logoSrc + '" alt="Sponsor" style="height:36px;max-width:120px;object-fit:contain;filter:brightness(1) contrast(1.05);" />';
          tIdx++;
        }
      });
    });

    // 5. Reemplazar textos de Kraqen a Flag Nation
    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    let n;
    while (n = walk.nextNode()) {
      if (n.nodeValue && /kraqen/i.test(n.nodeValue)) {
        n.nodeValue = n.nodeValue.replace(/Club kraQen/gi, 'Flag Nation').replace(/kraQen/gi, 'Flag Nation');
      }
    }
  }

  // Ejecución continua
  applyFlagNation();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyFlagNation);
  }
  window.addEventListener('load', applyFlagNation);

  const observer = new MutationObserver(function() {
    applyFlagNation();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
